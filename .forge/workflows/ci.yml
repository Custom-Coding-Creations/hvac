name: ForgeCI Self-Hosted CI Pipeline
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE'

jobs:
  validate-frontend:
    name: Frontend Validation Suite
    runs-on: [ linux, amd64, docker ]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate & Build Frontend
        run: |
          npm run lint || true
          npm run build
